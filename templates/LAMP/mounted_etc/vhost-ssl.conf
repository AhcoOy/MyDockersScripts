<VirtualHost *:443>

    ServerName __EMULATED_DOMAIN__
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl-mydockers/__EMULATED_DOMAIN__.crt
    SSLCertificateKeyFile /etc/apache2/ssl-mydockers/__EMULATED_DOMAIN__.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>
